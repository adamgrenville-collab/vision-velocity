[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never let the phone cache a stale shell — this is what forced the
# throwaway Netlify Drop URLs during debugging.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
